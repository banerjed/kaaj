name: Database

on: [push, pull_request]

# Runs the database suite against a throwaway PostgreSQL 17.
#
# A plain postgres:17 service, not `supabase start`: app.current_tenant_id()
# reads current_setting('request.jwt.claims'), which is pure Postgres, so
# isolation is faithfully testable without booting GoTrue/PostgREST/Kong/Studio.
# That keeps this job under a couple of minutes instead of adding several for
# containers none of these tests touch.

jobs:
  database:
    name: Schema, isolation and specification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install psql 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      # ONE bootstrap, shared with tests.yml, so the two CI databases and the
      # local one cannot drift. This step is also the migration test: every
      # migration, in order, from empty — one that is not replayable fails here.
      - name: Build the database
        run: packages/database/scripts/ci-database.sh

      # The load-bearing job: proves every policy actually filters, rather than
      # merely existing. Metadata checks pass on a policy of USING(true).
      - name: Tenant isolation (all tables)
        run: psql -v ON_ERROR_STOP=1 -v strict=1 -f packages/database/tests/verify-rls.sql

      - name: Specification checks
        run: psql -v ON_ERROR_STOP=1 -v strict=1 -f packages/database/tests/verify-stories.sql

      # Design rules from the ADRs: tenant_id leads every index, enums match
      # enumerations.json, the enum/reference-table split holds, every table has
      # tenant_id, and the PostgREST Data API stays closed.
      - name: Schema invariants
        run: psql -v ON_ERROR_STOP=1 -v strict=1 -v enum_fixture="$PWD/packages/enums/dist/expected-enums.sql" -f packages/database/tests/verify-invariants.sql

      # The enum fixture is generated and committed; a forgotten regeneration
      # would silently test a stale expectation.
      - name: Enum fixture is current
        run: |
          pnpm --filter @kaaj/enums build
          git diff --exit-code packages/enums/dist/expected-enums.sql \
            || { echo "::error::expected-enums.sql is stale. Run: pnpm --filter @kaaj/enums build"; exit 1; }

      # Structure snapshot: any unintended schema change fails here with a diff.
      # An intended one is committed alongside its migration.
      - name: Structure snapshot
        run: packages/database/scripts/db-snapshot.sh --check

      # Same entry point developers run locally, so the two cannot drift apart.
      # --db because the application checks have their own workflow.
      - name: ./check --db
        run: ./check --db
