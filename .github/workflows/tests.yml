name: Tests

# The application suites, against a real database.
#
# They need one. `test:security` covers `src/lib/server/auth`, `pii` and
# `tenant.test.ts`, and `turbo run test` adds `row-visibility.test.ts` — all of
# which connect on APP_DATABASE_URL as `app_user`, deliberately the NON-OWNER,
# because a suite running as the owner bypasses FORCE ROW LEVEL SECURITY and
# would pass straight over the policies it exists to check.
#
# This job previously had no database at all, so every run failed on
# "APP_DATABASE_URL is not set" before a single assertion executed. The 357
# security cases had never actually run in CI; the green ticks on other
# workflows were format, lint and build.
#
# The database is built by the same script `database.yml` uses, so the two
# cannot drift from each other or from `supabase db reset`.

on: [push, pull_request]

env:
  # A browser Supabase client is constructed at import time in a few modules.
  # These suites never contact it.
  PUBLIC_SUPABASE_URL: "https://fake_test_url.supabase.co"
  PUBLIC_SUPABASE_ANON_KEY: "fake_anon_key"
  PRIVATE_SUPABASE_SERVICE_ROLE: "fake_service_role"
  PRIVATE_STRIPE_API_KEY: "fake_strip_api_key"
  # NOT a fake. The PII suite opens sealed values in the committed fixture, so
  # it needs the key those values were sealed with — the dev KEK from
  # apps/web/.env.example, which is committed on purpose and is the same class
  # of credential as the app_user password: worthless off a dev machine, and
  # the reason a fresh clone can decrypt the fixture at all. pii.test.ts reads
  # .env.example itself to assert the two agree.
  PRIVATE_PII_KEK: "1:xZqNWwsCOqE17r/jdVQN2zca+L1Ztdop48xeCxAcxr0="

jobs:
  build_and_test:
    name: Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      # The owner — harnesses and snapshots.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # What the APPLICATION connects as. A non-owner, so RLS applies to it.
      APP_DATABASE_URL: postgresql://app_user:app_user@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install psql 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Build the database
        run: packages/database/scripts/ci-database.sh

      # Listed separately although `turbo run test` also covers it: without the
      # line, 357 authorization, PII and tenant-isolation cases are invisible
      # inside a single "unit tests" number.
      - name: Security — authorization, PII, tenant isolation
        run: pnpm test:security

      - name: Tests
        run: pnpm turbo run test
