<!doctype html>
<!--
  `group/html` is load-bearing, not decoration. 11 styles across ThemeToggle,
  TopbarProfileMenu and Sidebar are written as `group-data-[...]/html:` — they
  target the <html> element as a named Tailwind group. Without the class none
  of them ever match, and they fail silently: the theme toggle keeps showing
  one icon and the theme buttons show no selected state. Nothing errors. (L23)

  Count it with `grep -ro "/html:" apps/web/src`, not with a bracket-matching
  pattern: `group-[:not([data-theme])]/html:` nests brackets, and a `[^]]*`
  regex stops at the inner `]` and silently misses it. That mistake is how this
  comment briefly claimed 10 across two components.
-->
<html lang="en" class="group/html">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <!-- No maximum-scale / user-scalable=no: pinch-zoom must keep working. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Here, not via CSS @import, which the preload scanner cannot see (L18). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:wght@400;500;600;700&display=swap"
    />
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    style="min-height: 100vh; display: flex; flex-direction: column"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
