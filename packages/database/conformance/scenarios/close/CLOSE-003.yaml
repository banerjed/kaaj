# CLOSE-003 — An invoice dated in a closed period is refused. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: CLOSE-003
title: An invoice dated in a closed period is refused
version: 1
profile: ACS-US-ACCRUAL-1.0
module: CLOSE
isolation: transaction
actions:
- op: period.close
  args:
    period: 2026-01
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-20'
    lines:
    - item: SERVICE-A
- op: invoice.post
  args:
    invoice: INV1
  expect:
    result: refused
    refusal: period_closed
expect:
  documents:
    INV1:
      status: draft
  balances: {}
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-GL-003
  - INV-SYS-003
