# CLOSE-007 — The owner can reopen a closed period. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: CLOSE-007
title: The owner can reopen a closed period
version: 1
profile: ACS-US-ACCRUAL-1.0
module: CLOSE
isolation: transaction
actions:
- op: period.close
  args:
    period: 2026-01
- op: period.reopen
  args:
    period: 2026-01
  expect:
    result: ok
- op: journal.post
  args:
    date: '2026-01-15'
    description: Journal
    lines:
    - account: OFFICE_EXPENSE
      debit: '100.00'
    - account: OPERATING_BANK
      credit: '100.00'
  as: J1
expect:
  documents:
    J1:
      status: posted
  balances:
    OFFICE_EXPENSE: '100.00'
    OPERATING_BANK: '-100.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
