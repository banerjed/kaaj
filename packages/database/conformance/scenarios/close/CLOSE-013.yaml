# CLOSE-013 — The invoice date, not the form, decides the period. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: CLOSE-013
title: The invoice date, not the form, decides the period
version: 1
profile: ACS-US-ACCRUAL-1.0
module: CLOSE
