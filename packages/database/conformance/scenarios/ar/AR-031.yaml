# AR-031 — A paid invoice refuses a further receipt. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: AR-031
title: A paid invoice refuses a further receipt
version: 1
profile: ACS-US-ACCRUAL-1.0
module: AR
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      quantity: '1'
      tax: TAX-0
- op: invoice.post
  args:
    invoice: INV1
- op: payment.receive
  args:
    invoice: INV1
    amount: '100.00'
    date: '2026-01-15'
- op: payment.receive
  args:
    invoice: INV1
    amount: '1.00'
    date: '2026-01-20'
  expect:
    result: refused
    refusal: overpayment
expect:
  documents:
    INV1:
      status: paid
      amount_paid: '100.00'
  balances:
    OPERATING_BANK: '100.00'
    SERVICE_REVENUE: '-100.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AR-004
  - INV-SYS-003
