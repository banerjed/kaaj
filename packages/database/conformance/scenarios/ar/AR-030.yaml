# AR-030 — A payment dated before the invoice is refused. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: AR-030
title: A payment dated before the invoice is refused
version: 1
profile: ACS-US-ACCRUAL-1.0
module: AR
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      quantity: '1'
      tax: TAX-0
- op: invoice.post
  args:
    invoice: INV1
- op: payment.receive
  args:
    invoice: INV1
    amount: '100.00'
    date: '2026-01-05'
  expect:
    result: refused
    refusal: payment_before_invoice
expect:
  documents:
    INV1:
      status: sent
      amount_due: '100.00'
  balances:
    ACCOUNTS_RECEIVABLE: '100.00'
    SERVICE_REVENUE: '-100.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AR-004
  - INV-SYS-003
