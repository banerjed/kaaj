# AR-025 — A draft invoice can be voided and posts nothing. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: AR-025
title: A draft invoice can be voided and posts nothing
version: 1
profile: ACS-US-ACCRUAL-1.0
module: AR
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
