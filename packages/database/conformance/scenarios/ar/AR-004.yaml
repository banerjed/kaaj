# AR-004 — Two lines on different revenue accounts post two revenue lines. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: AR-004
title: Two lines on different revenue accounts post two revenue lines
version: 1
profile: ACS-US-ACCRUAL-1.0
module: AR
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
    - item: ITEM-A
- op: invoice.post
  args:
    invoice: INV1
  expect:
    result: ok
    journal:
    - account: ACCOUNTS_RECEIVABLE
      debit: '200.00'
      credit: '0.00'
    - account: SERVICE_REVENUE
      debit: '0.00'
      credit: '100.00'
    - account: PRODUCT_REVENUE
      debit: '0.00'
      credit: '100.00'
expect:
  documents:
    INV1:
      total: '200.00'
  balances:
    ACCOUNTS_RECEIVABLE: '200.00'
    SERVICE_REVENUE: '-100.00'
    PRODUCT_REVENUE: '-100.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AR-004
  - INV-SYS-003
