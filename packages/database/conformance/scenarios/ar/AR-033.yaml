# AR-033 — An issued invoice cannot be voided. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: AR-033
title: An issued invoice cannot be voided
version: 1
profile: ACS-US-ACCRUAL-1.0
module: AR
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      quantity: '1'
      tax: TAX-0
- op: invoice.post
  args:
    invoice: INV1
- op: invoice.void
  args:
    invoice: INV1
  expect:
    result: refused
    refusal: wrong_status
expect:
  documents:
    INV1:
      status: sent
  balances:
    ACCOUNTS_RECEIVABLE: '100.00'
    SERVICE_REVENUE: '-100.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AR-004
  - INV-SYS-003
