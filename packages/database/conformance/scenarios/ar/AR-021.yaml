- op: payment.receive
  args:
    invoice: INV1
    amount: '25.00'
    date: '2026-01-12'
- op: payment.receive
  args:
    invoice: INV1
    amount: '25.00'
    date: '2026-01-13'
- op: payment.receive
  args:
    invoice: INV1
    amount: '25.00'
    date: '2026-01-14'
