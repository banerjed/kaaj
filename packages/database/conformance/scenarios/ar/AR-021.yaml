# AR-021 — Four receipts of 25 settle a 100 invoice. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: AR-021
title: Four receipts of 25 settle a 100 invoice
version: 1
profile: ACS-US-ACCRUAL-1.0
module: AR
isolation: transaction
actions:
