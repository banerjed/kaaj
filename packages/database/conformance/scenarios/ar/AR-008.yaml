# AR-008 — Partial customer payment. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: AR-008
title: Partial customer payment
version: 1
profile: ACS-US-ACCRUAL-1.0
module: AR
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      quantity: '1'
      tax: TAX-0
- op: invoice.post
  args:
    invoice: INV1
- op: payment.receive
  args:
    invoice: INV1
    amount: '30.00'
    date: '2026-01-15'
  expect:
    result: ok
    journal:
    - account: OPERATING_BANK
      debit: '30.00'
      credit: '0.00'
    - account: ACCOUNTS_RECEIVABLE
      debit: '0.00'
      credit: '30.00'
expect:
  documents:
    INV1:
      status: partial
      amount_paid: '30.00'
      amount_due: '70.00'
  balances:
    OPERATING_BANK: '30.00'
    ACCOUNTS_RECEIVABLE: '70.00'
    SERVICE_REVENUE: '-100.00'
  subledger:
    customers:
      CUST-001: '70.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AR-004
  - INV-SYS-003
