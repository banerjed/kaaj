# AUD-004 — The journal entry resolves to its invoice. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: AUD-004
title: The journal entry resolves to its invoice
version: 1
profile: ACS-US-ACCRUAL-1.0
module: AUD
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
- op: invoice.post
  as: J1
  args:
    invoice: INV1
expect:
  documents:
    J1:
      source_type: invoice
      source_id: '@ref:INV1'
      source_resolves: 'true'
    INV1:
      journal_entry_id: '@ref:J1'
      journal_posted: 'true'
  balances:
    ACCOUNTS_RECEIVABLE: '100.00'
    SERVICE_REVENUE: '-100.00'
  invariants:
  - INV-JRN-008
  - INV-SYS-003
