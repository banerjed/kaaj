# AUD-010 — A posted journal cannot be altered quietly. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: AUD-010
title: A posted journal cannot be altered quietly
version: 1
profile: ACS-US-ACCRUAL-1.0
module: AUD
isolation: transaction
actions:
- op: journal.post
  args:
    date: '2026-01-10'
    description: Journal
    lines:
    - account: OFFICE_EXPENSE
      debit: '100.00'
    - account: OPERATING_BANK
      credit: '100.00'
  as: J1
- op: journal.attempt_update
  args:
    journal: J1
    debit: '150.00'
  expect:
    value:
      rows: '0'
expect:
  documents:
    J1:
      status: posted
  balances:
    OFFICE_EXPENSE: '100.00'
    OPERATING_BANK: '-100.00'
  invariants:
  - INV-JRN-001
