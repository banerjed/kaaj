# RPT-021 — A report shows the stored rounded figure and rounds no second time. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: RPT-021
title: A report shows the stored rounded figure and rounds no second time
version: 1
profile: ACS-US-ACCRUAL-1.0
module: RPT
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-003
    date: '2026-01-01'
    lines:
    - item: SERVICE-A
      unit_price: '0.01'
    rate: '1.234567'
- op: invoice.post
  args:
    invoice: INV1
- op: report.balance_sheet
  args:
    as_of: '2026-01-31'
  expect:
    result: ok
    value:
      ACCOUNTS_RECEIVABLE.amount: '0.01'
expect:
  balances:
    ACCOUNTS_RECEIVABLE: '0.01'
    SERVICE_REVENUE: '-0.01'
  invariants:
  - INV-JRN-001
  - INV-GL-001
