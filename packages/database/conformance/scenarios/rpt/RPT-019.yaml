# RPT-019 — The comparative column equals a standalone run. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: RPT-019
title: The comparative column equals a standalone run
version: 1
profile: ACS-US-ACCRUAL-1.0
module: RPT
isolation: transaction
actions:
