# FX-013 — A foreign-currency credit note uses the invoice rate. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: FX-013
title: A foreign-currency credit note uses the invoice rate
version: 1
profile: ACS-US-ACCRUAL-1.0
module: FX
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-003
    date: '2026-01-01'
    lines:
    - item: SERVICE-A
      quantity: '1'
      tax: TAX-0
    rate: '1.200000'
- op: invoice.post
  args:
    invoice: INV1
  expect:
    result: ok
    journal:
    - account: ACCOUNTS_RECEIVABLE
      debit: '120.00'
      credit: '0.00'
    - account: SERVICE_REVENUE
      debit: '0.00'
      credit: '120.00'
- op: invoice.credit
  args:
    invoice: INV1
    amount: '100.00'
    date: '2026-01-31'
  expect:
    result: ok
    journal:
    - account: SERVICE_REVENUE
      debit: '120.00'
      credit: '0.00'
    - account: ACCOUNTS_RECEIVABLE
      debit: '0.00'
      credit: '120.00'
expect:
  documents:
    INV1:
      status: credited
      amount_due: '0.00'
  balances: {}
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AP-001
  - INV-AP-002
