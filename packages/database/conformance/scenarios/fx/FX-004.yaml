# FX-004 — Settlement at a lower rate is a realized loss. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: FX-004
title: Settlement at a lower rate is a realized loss
version: 1
profile: ACS-US-ACCRUAL-1.0
module: FX
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-003
    date: '2026-01-01'
    lines:
    - item: SERVICE-A
      quantity: '1'
      tax: TAX-0
    rate: '1.200000'
- op: invoice.post
  args:
    invoice: INV1
  expect:
    result: ok
    journal:
    - account: ACCOUNTS_RECEIVABLE
      debit: '120.00'
      credit: '0.00'
    - account: SERVICE_REVENUE
      debit: '0.00'
      credit: '120.00'
- op: payment.receive
  args:
    invoice: INV1
    amount: '100.00'
    date: '2026-03-01'
    bank: EUR Bank
  expect:
    result: ok
    journal:
    - account: OPERATING_BANK
      debit: '115.00'
      credit: '0.00'
    - account: REALIZED_FX_GAIN_LOSS
      debit: '5.00'
      credit: '0.00'
    - account: ACCOUNTS_RECEIVABLE
      debit: '0.00'
      credit: '120.00'
expect:
  documents:
    INV1:
      status: paid
  balances:
    OPERATING_BANK: '115.00'
    SERVICE_REVENUE: '-120.00'
    REALIZED_FX_GAIN_LOSS: '5.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AP-001
  - INV-AP-002
