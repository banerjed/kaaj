# FX-016 — A zero-decimal currency. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: FX-016
title: A zero-decimal currency
version: 1
profile: ACS-US-ACCRUAL-1.0
module: FX
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-006
    date: '2026-01-01'
    lines:
    - item: SERVICE-A
      unit_price: '10000'
    rate: '0.006500'
- op: invoice.post
  args:
    invoice: INV1
  expect:
    result: ok
    journal:
    - account: ACCOUNTS_RECEIVABLE
      debit: '65.00'
      credit: '0.00'
    - account: SERVICE_REVENUE
      debit: '0.00'
      credit: '65.00'
expect:
  documents:
    INV1:
      currency: JPY
      total: '10000'
      base_total: '65.00'
  balances:
    ACCOUNTS_RECEIVABLE: '65.00'
    SERVICE_REVENUE: '-65.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AP-001
  - INV-AP-002
