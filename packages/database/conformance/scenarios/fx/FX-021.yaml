# FX-021 — A foreign-currency settlement before any rate exists is refused. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: FX-021
title: A foreign-currency settlement before any rate exists is refused
version: 1
profile: ACS-US-ACCRUAL-1.0
module: FX
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-003
    date: '2025-12-15'
    lines:
    - item: SERVICE-A
      quantity: '1'
      tax: TAX-0
    rate: '1.200000'
- op: invoice.post
  args:
    invoice: INV1
- op: payment.receive
  args:
    invoice: INV1
    amount: '100.00'
    date: '2025-12-20'
    bank: EUR Bank
  expect:
    result: refused
    refusal: no_rate
expect:
  documents:
    INV1:
      status: sent
  balances:
    ACCOUNTS_RECEIVABLE: '120.00'
    SERVICE_REVENUE: '-120.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AP-001
  - INV-AP-002
