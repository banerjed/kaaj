# FX-020 — A payment in another currency than the invoice is refused. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: FX-020
title: A payment in another currency than the invoice is refused
version: 1
profile: ACS-US-ACCRUAL-1.0
module: FX
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-003
    date: '2026-01-01'
    lines:
    - item: SERVICE-A
      quantity: '1'
      tax: TAX-0
    rate: '1.200000'
- op: invoice.post
  args:
    invoice: INV1
  expect:
    result: ok
    journal:
    - account: ACCOUNTS_RECEIVABLE
      debit: '120.00'
      credit: '0.00'
    - account: SERVICE_REVENUE
      debit: '0.00'
      credit: '120.00'
- op: payment.receive
  args:
    invoice: INV1
    amount: '100.00'
    date: '2026-01-31'
    bank: Operating Bank
  expect:
    result: refused
    refusal: currency_mismatch
expect:
  documents:
    INV1:
      status: sent
      amount_due: '100.00'
  balances:
    ACCOUNTS_RECEIVABLE: '120.00'
    SERVICE_REVENUE: '-120.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AP-001
  - INV-AP-002
