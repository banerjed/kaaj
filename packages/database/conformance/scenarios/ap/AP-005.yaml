# AP-005 — One batch payment covers two bills. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: AP-005
title: One batch payment covers two bills
version: 1
profile: ACS-US-ACCRUAL-1.0
module: AP
isolation: transaction
actions:
- op: bill.create
  as: B1
  args:
    vendor: VEND-001
    date: '2026-01-10'
    lines:
    - account: OFFICE_EXPENSE
      amount: '100.00'
      tax: TAX-0
- op: bill.approve
  args:
    bill: B1
- op: bill.create
  as: B2
  args:
    vendor: VEND-001
    date: '2026-01-10'
    lines:
    - account: OFFICE_EXPENSE
      amount: '200.00'
- op: bill.approve
  args:
    bill: B2
- op: bill.pay_batch
  actor: finance
  args:
    bills:
    - B1
    - B2
    date: '2026-01-20'
  expect:
    result: ok
    value:
      payments: '1'
      payment1.total: '300.00'
      payment1.bills: '2'
    journal:
    - account: ACCOUNTS_PAYABLE
      debit: '100.00'
      credit: '0.00'
    - account: ACCOUNTS_PAYABLE
      debit: '200.00'
      credit: '0.00'
    - account: OPERATING_BANK
      debit: '0.00'
      credit: '300.00'
expect:
  documents:
    B1:
      status: paid
      amount_due: '0.00'
    B2:
      status: paid
      amount_due: '0.00'
  balances:
    OFFICE_EXPENSE: '300.00'
    OPERATING_BANK: '-300.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AP-001
  - INV-AP-002
  - INV-SYS-003
