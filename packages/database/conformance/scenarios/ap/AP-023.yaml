# AP-023 — Paying a draft bill is refused. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: AP-023
title: Paying a draft bill is refused
version: 1
profile: ACS-US-ACCRUAL-1.0
module: AP
isolation: transaction
actions:
- op: bill.create
  as: B1
  args:
    vendor: VEND-001
    date: '2026-01-10'
    lines:
    - account: OFFICE_EXPENSE
      amount: '100.00'
- op: bill.pay
  actor: finance
  args:
    bill: B1
    amount: '100.00'
    date: '2026-01-20'
  expect:
    result: refused
    refusal: wrong_status
expect:
  documents:
    B1:
      status: draft
  balances: {}
  invariants:
  - INV-GL-003
  - INV-SYS-003
