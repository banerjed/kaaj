# AP-021 — Overpaying a bill is refused. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: AP-021
title: Overpaying a bill is refused
version: 1
profile: ACS-US-ACCRUAL-1.0
module: AP
isolation: transaction
actions:
- op: bill.create
  as: B1
  args:
    vendor: VEND-001
    date: '2026-01-10'
    lines:
    - account: OFFICE_EXPENSE
      amount: '100.00'
      tax: TAX-0
- op: bill.approve
  args:
    bill: B1
- op: bill.pay
  actor: finance
  args:
    bill: B1
    amount: '150.00'
    date: '2026-01-20'
  expect:
    result: refused
    refusal: overpayment
expect:
  documents:
    B1:
      status: approved
      amount_due: '100.00'
  balances:
    OFFICE_EXPENSE: '100.00'
    ACCOUNTS_PAYABLE: '-100.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AP-001
  - INV-AP-002
  - INV-SYS-003
