# BANK-007 — An imported receipt matched to its payment posts nothing. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: BANK-007
title: An imported receipt matched to its payment posts nothing
version: 1
profile: ACS-US-ACCRUAL-1.0
module: BANK
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      quantity: '1'
      tax: TAX-0
- op: invoice.post
  args:
    invoice: INV1
- op: payment.receive
  args:
    invoice: INV1
    amount: '100.00'
    date: '2026-01-15'
  as: PAY1
- op: bank.import
  as: T1
  args:
    statement: S1
    lines:
    - date: '2026-01-15'
      amount: '100.00'
      description: ACME WIRE
  expect:
    value:
      imported: '1'
      duplicates: '0'
- op: bank.match
  args:
    transaction: T1
    payment: PAY1
  expect:
    result: ok
    value:
      from: unmatched
expect:
  documents:
    T1:
      status: matched
  balances:
    OPERATING_BANK: '100.00'
    SERVICE_REVENUE: '-100.00'
  journals_total: '2'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AR-004
  - INV-SYS-003
