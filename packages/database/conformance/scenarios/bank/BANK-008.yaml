# BANK-008 — An imported payment matched to its vendor payment posts nothing. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: BANK-008
title: An imported payment matched to its vendor payment posts nothing
version: 1
profile: ACS-US-ACCRUAL-1.0
module: BANK
isolation: transaction
actions:
- op: bill.create
  as: B1
  args:
    vendor: VEND-001
    date: '2026-01-10'
    lines:
    - account: OFFICE_EXPENSE
      amount: '100.00'
      tax: TAX-0
- op: bill.approve
  args:
    bill: B1
- op: bill.pay
  actor: finance
  args:
    bill: B1
    amount: '100.00'
    date: '2026-01-20'
  as: PAY1
- op: bank.import
  as: T1
  args:
    statement: S1
    lines:
    - date: '2026-01-20'
      amount: '-100.00'
      description: SUPPLYCO
- op: bank.match
  args:
    transaction: T1
    payment: PAY1
  expect:
    result: ok
expect:
  documents:
    T1:
      status: matched
  balances:
    OFFICE_EXPENSE: '100.00'
    OPERATING_BANK: '-100.00'
  journals_total: '2'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AP-001
  - INV-AP-002
  - INV-SYS-003
