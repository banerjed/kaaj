# BANK-013 — Importing the same statement twice creates no second transaction. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: BANK-013
title: Importing the same statement twice creates no second transaction
version: 1
profile: ACS-US-ACCRUAL-1.0
module: BANK
isolation: transaction
actions:
- op: bank.import
  as: T1
  args:
    statement: S1
    lines:
    - date: '2026-01-15'
      amount: '100.00'
      description: ACME WIRE
  expect:
    value:
      imported: '1'
      duplicates: '0'
- op: bank.import
  args:
    statement: S1
    lines:
    - date: '2026-01-15'
      amount: '100.00'
      description: ACME WIRE
  expect:
    value:
      imported: '0'
      duplicates: '1'
      transactions: '1'
expect:
  balances: {}
  journals_total: '0'
  invariants:
  - INV-JRN-001
  - INV-GL-001
