# TAX-006 — A full credit note reverses the tax. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: TAX-006
title: A full credit note reverses the tax
version: 1
profile: ACS-US-ACCRUAL-1.0
module: TAX
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      tax: TAX-8
      tax_amount: '8.00'
- op: invoice.post
  args:
    invoice: INV1
  expect:
    result: ok
    journal:
    - account: ACCOUNTS_RECEIVABLE
      debit: '108.00'
      credit: '0.00'
    - account: SERVICE_REVENUE
      debit: '0.00'
      credit: '100.00'
    - account: SALES_TAX_PAYABLE
      debit: '0.00'
      credit: '8.00'
- op: invoice.credit
  args:
    invoice: INV1
    amount: '108.00'
    date: '2026-01-20'
  expect:
    result: ok
    journal:
    - account: SERVICE_REVENUE
      debit: '100.00'
      credit: '0.00'
    - account: SALES_TAX_PAYABLE
      debit: '8.00'
      credit: '0.00'
    - account: ACCOUNTS_RECEIVABLE
      debit: '0.00'
      credit: '108.00'
expect:
  documents:
    INV1:
      status: credited
      amount_due: '0.00'
  balances: {}
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AR-004
  - INV-SYS-003
  - INV-TAX-002
