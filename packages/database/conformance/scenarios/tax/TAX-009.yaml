# TAX-009 — Fractional-cent line tax rounds half away from zero. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: TAX-009
title: Fractional-cent line tax rounds half away from zero
version: 1
profile: ACS-US-ACCRUAL-1.0
module: TAX
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      unit_price: '0.07'
      tax: TAX-8
      tax_amount: '0.01'
- op: invoice.post
  args:
    invoice: INV1
  expect:
    result: ok
    journal:
    - account: ACCOUNTS_RECEIVABLE
      debit: '0.08'
      credit: '0.00'
    - account: SERVICE_REVENUE
      debit: '0.00'
      credit: '0.07'
    - account: SALES_TAX_PAYABLE
      debit: '0.00'
      credit: '0.01'
expect:
  documents:
    INV1:
      total: '0.08'
  balances:
    ACCOUNTS_RECEIVABLE: '0.08'
    SERVICE_REVENUE: '-0.07'
    SALES_TAX_PAYABLE: '-0.01'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AR-004
  - INV-SYS-003
  - INV-TAX-002
