# TAX-013 — A new rate applies to new invoices only. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: TAX-013
title: A new rate applies to new invoices only
version: 1
profile: ACS-US-ACCRUAL-1.0
module: TAX
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      tax: TAX-8
      tax_amount: '8.00'
- op: invoice.post
  args:
    invoice: INV1
- op: tax.create_rate
  as: R9
  args:
    code: TAX-9
    rate: '0.0900'
    name: 9% exclusive
- op: invoice.create
  as: INV2
  args:
    customer: CUST-001
    date: '2026-01-20'
    lines:
    - item: SERVICE-A
      tax: TAX-9
      tax_amount: '9.00'
- op: invoice.post
  args:
    invoice: INV2
  expect:
    result: ok
    journal:
    - account: ACCOUNTS_RECEIVABLE
      debit: '109.00'
      credit: '0.00'
    - account: SERVICE_REVENUE
      debit: '0.00'
      credit: '100.00'
    - account: SALES_TAX_PAYABLE
      debit: '0.00'
      credit: '9.00'
expect:
  documents:
    INV1:
      tax_total: '8.00'
    INV2:
      tax_total: '9.00'
    R9:
      rate: '0.0900'
  balances:
    ACCOUNTS_RECEIVABLE: '217.00'
    SERVICE_REVENUE: '-200.00'
    SALES_TAX_PAYABLE: '-17.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AR-004
  - INV-SYS-003
  - INV-TAX-002
