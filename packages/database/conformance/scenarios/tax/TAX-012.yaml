# TAX-012 — Two rates on one invoice post two tax lines. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: TAX-012
title: Two rates on one invoice post two tax lines
version: 1
profile: ACS-US-ACCRUAL-1.0
module: TAX
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      tax: TAX-8
      tax_amount: '8.00'
    - item: SERVICE-A
      tax: TAX-5
      tax_amount: '5.00'
- op: invoice.post
  args:
    invoice: INV1
  expect:
    result: ok
    journal:
    - account: ACCOUNTS_RECEIVABLE
      debit: '213.00'
      credit: '0.00'
    - account: SERVICE_REVENUE
      debit: '0.00'
      credit: '200.00'
    - account: SALES_TAX_PAYABLE
      debit: '0.00'
      credit: '8.00'
    - account: SALES_TAX_PAYABLE
      debit: '0.00'
      credit: '5.00'
expect:
  documents:
    INV1:
      tax_total: '13.00'
      total: '213.00'
  balances:
    ACCOUNTS_RECEIVABLE: '213.00'
    SERVICE_REVENUE: '-200.00'
    SALES_TAX_PAYABLE: '-13.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AR-004
  - INV-SYS-003
  - INV-TAX-002
