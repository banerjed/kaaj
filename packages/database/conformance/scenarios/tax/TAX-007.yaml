# TAX-007 — A partial credit reverses tax in proportion. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: TAX-007
title: A partial credit reverses tax in proportion
version: 1
profile: ACS-US-ACCRUAL-1.0
module: TAX
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      tax: TAX-8
      tax_amount: '8.00'
- op: invoice.post
  args:
    invoice: INV1
- op: invoice.credit
  args:
    invoice: INV1
    amount: '54.00'
    date: '2026-01-20'
  expect:
    result: ok
    journal:
    - account: SERVICE_REVENUE
      debit: '50.00'
      credit: '0.00'
    - account: SALES_TAX_PAYABLE
      debit: '4.00'
      credit: '0.00'
    - account: ACCOUNTS_RECEIVABLE
      debit: '0.00'
      credit: '54.00'
expect:
  documents:
    INV1:
      amount_due: '54.00'
  balances:
    ACCOUNTS_RECEIVABLE: '54.00'
    SERVICE_REVENUE: '-50.00'
    SALES_TAX_PAYABLE: '-4.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AR-004
  - INV-SYS-003
  - INV-TAX-002
