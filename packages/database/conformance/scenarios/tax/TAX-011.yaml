# TAX-011 — Three lines of one unit: tax rounds on each line. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: TAX-011
title: 'Three lines of one unit: tax rounds on each line'
version: 1
profile: ACS-US-ACCRUAL-1.0
module: TAX
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - &id001
      item: ITEM-C
      tax: TAX-8
      tax_amount: '0.01'
    - *id001
    - *id001
- op: invoice.post
  args:
    invoice: INV1
  expect:
    result: ok
    journal:
    - account: ACCOUNTS_RECEIVABLE
      debit: '0.33'
      credit: '0.00'
    - account: SERVICE_REVENUE
      debit: '0.00'
      credit: '0.30'
    - account: SALES_TAX_PAYABLE
      debit: '0.00'
      credit: '0.03'
expect:
  documents:
    INV1:
      subtotal: '0.30'
      tax_total: '0.03'
      total: '0.33'
  balances:
    ACCOUNTS_RECEIVABLE: '0.33'
    SERVICE_REVENUE: '-0.30'
    SALES_TAX_PAYABLE: '-0.03'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
  - INV-AR-004
  - INV-SYS-003
  - INV-TAX-002
