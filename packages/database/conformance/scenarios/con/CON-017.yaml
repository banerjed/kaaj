# CON-017 — Two different journals at once both post, with distinct numbers. Spec: docs/34-accounting-conformance-spec-V1.md.
id: CON-017
title: Two different journals at once both post, with distinct numbers
version: 1
profile: ACS-US-ACCRUAL-1.0
module: CON
isolation: database
actions: []
concurrent:
- actions:
  - op: journal.post
    args:
      date: '2026-01-15'
      lines:
      - account: OFFICE_EXPENSE
        debit: '1.00'
      - account: OPERATING_BANK
        credit: '1.00'
- actions:
  - op: journal.post
    args:
      date: '2026-01-15'
      lines:
      - account: OFFICE_EXPENSE
        debit: '2.00'
      - account: OPERATING_BANK
        credit: '2.00'
expect:
  lanes:
    succeeded: '2'
  journals_total: '2'
  balances:
    OFFICE_EXPENSE: '3.00'
    OPERATING_BANK: '-3.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-GL-002
