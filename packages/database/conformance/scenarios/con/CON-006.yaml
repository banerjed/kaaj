# CON-006 — A credit and a receipt against one invoice at once: exactly one. Spec: docs/34-accounting-conformance-spec-V1.md.
id: CON-006
title: 'A credit and a receipt against one invoice at once: exactly one'
version: 1
profile: ACS-US-ACCRUAL-1.0
module: CON
isolation: database
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      quantity: '1'
      tax: TAX-0
- op: invoice.post
  args:
    invoice: INV1
concurrent:
- actions:
  - op: invoice.credit
    args:
      invoice: INV1
      amount: '100.00'
      date: '2026-01-15'
- actions:
  - op: payment.receive
    args:
      invoice: INV1
      amount: '100.00'
      date: '2026-01-15'
expect:
  lanes:
    succeeded: '1'
  documents:
    INV1:
      amount_due: '0.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-004
  - INV-GL-006
