# NUM-014 — A balance reaches TypeScript as a string. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: NUM-014
title: A balance reaches TypeScript as a string
version: 1
profile: ACS-US-ACCRUAL-1.0
module: NUM
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      quantity: '1'
      tax: TAX-0
- op: invoice.post
  args:
    invoice: INV1
- op: ledger.balance_type
  args:
    account: ACCOUNTS_RECEIVABLE
  expect:
    value:
      type: string
      value: '100.00'
expect:
  balances:
    ACCOUNTS_RECEIVABLE: '100.00'
    SERVICE_REVENUE: '-100.00'
  invariants:
  - INV-JRN-001
  - INV-GL-001
  - INV-AR-001
  - INV-AR-002
