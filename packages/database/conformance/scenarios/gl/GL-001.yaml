# GL-001 — Simple balanced journal. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: GL-001
title: Simple balanced journal
version: 1
profile: ACS-US-ACCRUAL-1.0
module: GL
isolation: transaction
actions:
- op: journal.post
  args:
    date: '2026-01-10'
    description: Office supplies
    lines:
    - account: OFFICE_EXPENSE
      debit: '100.00'
    - account: OPERATING_BANK
      credit: '100.00'
  as: J1
  expect:
    result: ok
    journal:
    - account: OFFICE_EXPENSE
      debit: '100.00'
      credit: '0.00'
    - account: OPERATING_BANK
      debit: '0.00'
      credit: '100.00'
expect:
  documents:
    J1:
      status: posted
      source_type: manual
      line_count: '2'
      accounting_period: 2026-01
  balances:
    OFFICE_EXPENSE: '100.00'
    OPERATING_BANK: '-100.00'
  invariants:
  - INV-JRN-001
  - INV-JRN-002
  - INV-GL-001
  - INV-GL-002
