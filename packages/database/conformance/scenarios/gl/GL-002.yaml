# GL-002 — Three-line journal. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: GL-002
title: Three-line journal
version: 1
profile: ACS-US-ACCRUAL-1.0
module: GL
isolation: transaction
actions:
- op: journal.post
  args:
    date: '2026-01-10'
    description: Journal
    lines:
    - account: RENT_EXPENSE
      debit: '700.00'
    - account: OFFICE_EXPENSE
      debit: '300.00'
    - account: OPERATING_BANK
      credit: '1000.00'
  as: J1
  expect:
    result: ok
    journal:
    - account: RENT_EXPENSE
      debit: '700.00'
      credit: '0.00'
    - account: OFFICE_EXPENSE
      debit: '300.00'
      credit: '0.00'
    - account: OPERATING_BANK
      debit: '0.00'
      credit: '1000.00'
expect:
  balances:
    RENT_EXPENSE: '700.00'
    OFFICE_EXPENSE: '300.00'
    OPERATING_BANK: '-1000.00'
  invariants:
  - INV-JRN-001
  - INV-JRN-002
  - INV-GL-001
  - INV-GL-002
