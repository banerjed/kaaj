# GL-018 — An invoice journal links to its invoice. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: GL-018
title: An invoice journal links to its invoice
version: 1
profile: ACS-US-ACCRUAL-1.0
module: GL
isolation: transaction
actions:
- op: invoice.create
  as: INV1
  args:
    customer: CUST-001
    date: '2026-01-10'
    lines:
    - item: SERVICE-A
      quantity: '1'
      tax: TAX-0
- op: invoice.post
  args:
    invoice: INV1
  expect:
    result: ok
    journal:
    - account: ACCOUNTS_RECEIVABLE
      debit: '100.00'
      credit: '0.00'
    - account: SERVICE_REVENUE
      debit: '0.00'
      credit: '100.00'
expect:
  documents:
    INV1:
      status: sent
  balances:
    ACCOUNTS_RECEIVABLE: '100.00'
    SERVICE_REVENUE: '-100.00'
  invariants:
  - INV-SYS-003
  - INV-GL-003
  - INV-JRN-008
