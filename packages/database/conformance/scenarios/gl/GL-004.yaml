# GL-004 — Unbalanced journal is refused. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: GL-004
title: Unbalanced journal is refused
version: 1
profile: ACS-US-ACCRUAL-1.0
module: GL
isolation: transaction
actions:
- op: journal.post
  args:
    date: '2026-01-10'
    description: Journal
    lines:
    - account: OFFICE_EXPENSE
      debit: '100.00'
    - account: OPERATING_BANK
      credit: '99.00'
  expect:
    result: refused
    refusal: does_not_balance
expect:
  balances: {}
  invariants:
  - INV-GL-004
  - INV-SYS-004
