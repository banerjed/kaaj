# GL-020 — A journal on another tenant's account is refused. Spec: docs/34-accounting-conformance-spec-V1.md section 10.
id: GL-020
title: A journal on another tenant's account is refused
version: 1
profile: ACS-US-ACCRUAL-1.0
module: GL
isolation: transaction
actions:
- op: journal.post
  args:
    date: '2026-01-10'
    description: Journal
    lines:
    - account: OTHER_TENANT_ACCOUNT
      debit: '100.00'
    - account: OPERATING_BANK
      credit: '100.00'
  expect:
    result: refused
    refusal: no_such_account
expect:
  balances: {}
  invariants:
  - INV-GL-004
  - INV-JRN-007
